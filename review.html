<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leave a Review | Albania Ride</title>
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f8f9;color:#102536}.wrap{max-width:760px;margin:auto;padding:42px 18px}.card{background:#fff;border:1px solid #dbe7ea;border-radius:24px;padding:26px;box-shadow:0 18px 50px rgba(7,27,43,.1)}a{color:#0b7c75;text-decoration:none;font-weight:800}h1{font-size:38px;line-height:1.05;margin:12px 0 10px;color:#071b2b}p{color:#5f7481;line-height:1.7}form{display:grid;gap:14px;margin-top:24px}label{display:grid;gap:7px;font-weight:800;font-size:13px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #cbdadd;border-radius:13px;padding:13px 14px;background:#fbfdfd;font:inherit}textarea{min-height:130px}.stars{display:flex;gap:8px}.star{font-size:32px;cursor:pointer;color:#b8c3c8;background:none;border:0;padding:0}.star.active{color:#d99d14}.submit{border:0;border-radius:14px;padding:14px 18px;background:#0d8f88;color:#fff;font-weight:900;font:inherit;cursor:pointer}.status{margin-top:8px;font-size:14px}.note{font-size:12px;color:#718692}</style></head>
<body><div class="wrap"><a href="/">← Albania Ride</a><div class="card"><h1>Leave a review</h1><p>Thank you for travelling with Albania Ride. Your review will be checked before it appears publicly.</p>
<form id="reviewForm"><label>Full name<input id="name" required maxlength="80"></label><label>Country<input id="country" maxlength="80"></label><label>Route<input id="route" maxlength="120" placeholder="e.g. Tirana → Sarandë"></label><label>Rating<div class="stars" id="stars"><button type="button" class="star" data-v="1">★</button><button type="button" class="star" data-v="2">★</button><button type="button" class="star" data-v="3">★</button><button type="button" class="star" data-v="4">★</button><button type="button" class="star" data-v="5">★</button></div></label><label>Your review<textarea id="comment" required maxlength="1200"></textarea></label><button class="submit" type="submit">Submit review</button><div class="note">Reviews are published only after approval.</div><div id="status" class="status"></div></form></div></div>
<script>let rating=5;const stars=[...document.querySelectorAll('.star')];function paint(v){stars.forEach(s=>s.classList.toggle('active',Number(s.dataset.v)<=v))}stars.forEach(s=>s.onclick=()=>{rating=Number(s.dataset.v);paint(rating)});paint(rating);document.getElementById('reviewForm').onsubmit=async e=>{e.preventDefault();const payload={name:document.getElementById('name').value.trim(),country:document.getElementById('country').value.trim(),route:document.getElementById('route').value.trim(),rating,comment:document.getElementById('comment').value.trim()};const st=document.getElementById('status');st.textContent='Sending...';try{const r=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');st.textContent='Thank you. Your review was submitted for approval.';e.target.reset();rating=5;paint(rating)}catch(err){st.textContent='Could not submit review. Please try again later.'}}</script></body></html>
