<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Admin | Albania Ride</title>
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f8f9;color:#102536}.wrap{max-width:980px;margin:auto;padding:32px 16px}.card{background:#fff;border:1px solid #dbe7ea;border-radius:18px;padding:18px;margin-bottom:12px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.ok{background:#0d8f88;color:#fff}.no{background:#e7edf0}.muted{color:#617682}input{padding:12px;border:1px solid #cbdadd;border-radius:10px;width:100%;box-sizing:border-box}</style></head><body><div class="wrap"><h1>Albania Ride Reviews</h1><div class="card"><input id="token" type="password" placeholder="Admin token"><div style="height:10px"></div><button class="btn ok" onclick="load()">Load reviews</button></div><div id="list"></div></div>
<script>const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){const token=document.getElementById('token').value.trim();const r=await fetch('/api/admin-reviews',{headers:{'x-admin-token':token}});const d=await r.json().catch(()=>[]);const list=document.getElementById('list');if(!r.ok){list.innerHTML='<div class="card">Access denied.</div>';return}list.innerHTML=d.map(x=>`<div class="card"><b>${esc(x.name)}</b> · ${'★'.repeat(x.rating||5)} ${x.country?'· '+esc(x.country):''}<div class="muted">${esc(x.route||'')}</div><p>${esc(x.comment)}</p><button class="btn ok" onclick="act('${x.id}','approve')">Approve</button> <button class="btn no" onclick="act('${x.id}','reject')">Reject</button></div>`).join('')||'<div class="card">No pending reviews.</div>'}async function act(id,action){const token=document.getElementById('token').value.trim();await fetch('/api/admin-reviews',{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':token},body:JSON.stringify({id,action})});load()}</script></body></html>
